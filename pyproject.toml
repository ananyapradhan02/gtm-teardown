[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-teardown"
version = "0.12.0"
description = "Classify how agentic-AI companies go to market from their public copy: pricing model, GTM motion, messaging themes; compare, rank, track drift, draft outreach."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ananya Pradhan" }]
keywords = ["gtm", "go-to-market", "product-marketing", "agentic-ai", "competitive-intelligence", "positioning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
gtm-teardown = "gtm_teardown.cli:main"

[project.urls]
Homepage = "https://github.com/ananyapradhan02/gtm-teardown"
Issues = "https://github.com/ananyapradhan02/gtm-teardown/issues"

[tool.setuptools.packages.find]
include = ["gtm_teardown*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
